
<script>
"use strict";

document.addEventListener("DOMContentLoaded", function () {
    // Menú móvil
    const menuBtn = document.getElementById("mobile-menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");

    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener("click", function () {
            mobileMenu.classList.toggle("hidden");
        });

        mobileMenu.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                mobileMenu.classList.add("hidden");
            });
        });
    }

    // Vista previa de imágenes
    document.querySelectorAll("[data-slot]").forEach(function (slot) {
        const input = slot.querySelector('input[type="file"]');

        if (!input) return;

        slot.addEventListener("click", function (event) {
            if (event.target === input) return;
            input.click();
        });

        input.addEventListener("change", function () {
            const file = input.files && input.files[0];

            if (!file || !file.type.startsWith("image/")) return;

            let img = slot.querySelector("img");

            if (!img) {
                img = document.createElement("img");
                img.alt = "Vista previa de la imagen seleccionada";
                slot.appendChild(img);
            }

            if (img.dataset.objectUrl) {
                URL.revokeObjectURL(img.dataset.objectUrl);
            }

            const objectUrl = URL.createObjectURL(file);
            img.src = objectUrl;
            img.dataset.objectUrl = objectUrl;

            const placeholder = slot.querySelector(".slot-placeholder");

            if (placeholder) {
                placeholder.style.display = "none";
            }
        });
    });

    // Información interactiva de la arquitectura
    const flowData = {
        1: {
            title: "Paso 01: Captura física",
            desc: "El docente escribe con el plumón adaptado y los sensores capturan la señal."
        },
        2: {
            title: "Paso 02: Procesamiento ESP32",
            desc: "El microcontrolador procesa los datos de los sensores y prepara la información."
        },
        3: {
            title: "Paso 03: Servidor Node.js",
            desc: "El servidor local distribuye los trazos a los dispositivos conectados."
        },
        4: {
            title: "Paso 04: Pantallas de los estudiantes",
            desc: "Los estudiantes consultan la pizarra digital desde sus navegadores."
        }
    };

    function showFlowInfo(step) {
        const title = document.getElementById("flow-title");
        const desc = document.getElementById("flow-desc");
        const info = flowData[step];

        if (!title || !desc || !info) return;

        title.textContent = info.title;
        desc.textContent = info.desc;
    }

    document.querySelectorAll(".flow-step").forEach(function (step, index) {
        step.addEventListener("click", function () {
            showFlowInfo(index + 1);
        });
    });

    showFlowInfo(1);
});
</script>
